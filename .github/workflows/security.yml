
name: Pipeline de sécurité

on:
  push:
  pull_request:

jobs:
  tests:
    name: Suite de tests de sécurité
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm test

  
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer tout le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scanner tout l'historique Git
        run: |
          gitleaks git . \
            --config=.gitleaks.toml \
            --redact \
            --verbose

      

  
  dependencies:
    name: Audit des dépendances
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les vulnérabilités
        run: npm audit --audit-level=high




    